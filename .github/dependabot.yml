# ============================================================
# .github/dependabot.yml
# ============================================================
# "고정하되 갱신을 자동화한다" — 재현성과 패치 반영의 표준 균형.
#   Action  = 커밋 SHA 핀  → github-actions ecosystem 이 갱신 PR
#   base    = digest 핀    → docker ecosystem 이 갱신 PR   ★ G8
# 핀만 하고 방치하면 보안 패치를 받지 못한다.
# PR 로 오므로 검토 없이 반영되지 않는다 — 공급망 통제를 유지하면서 최신성을 확보.
# ============================================================

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "supply-chain"]

  # ★ G8 — base image digest 핀의 짝
  - package-ecosystem: "docker"
    directory: "/images/s5-good"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(image)"
    labels: ["dependencies", "supply-chain", "base-image"]
