version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # Terraform provider(스택별). 메이저 업그레이드는 문법이나 state가 바뀔 수 있어서 자동 PR로 받지 않는다.
  # update-types(semver-major)로는 안 막힌다. lock 파일을 커밋하지 않아서 Dependabot이 현재 버전을 모르고, 메이저인지 판단을 못 한다.
  # 그래서 versions 범위로 다음 메이저만 막는다. aws 메이저가 스택마다 달라서(00~03은 5.x, 04·05는 6.x) 블록을 나눴다.

  # aws 5.x 스택(00~03). 01~03을 6.x로 올릴 때 이 범위를 ">= 7.0.0"으로 바꾼다.
  - package-ecosystem: "terraform"
    directories:
      - "/00-bootstrap"
      - "/01-network"
      - "/02-security"
      - "/03-workload"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "terraform"
    ignore:
      - dependency-name: "hashicorp/aws"
        versions: [">= 6.0.0"]

  # aws 6.x 스택(04·05)
  - package-ecosystem: "terraform"
    directories:
      - "/04-eks"
      - "/05-k8s"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "terraform"
    ignore:
      - dependency-name: "hashicorp/aws"
        versions: [">= 7.0.0"]
      # kubernetes 프로바이더는 05 스키마를 확인한 3.2.x로 묶어 둔다. 클러스터 세션에서 확인한 뒤 이 줄을 지우고 올린다.
      - dependency-name: "hashicorp/kubernetes"
        versions: [">= 3.3.0"]

  # 서비스 베이스 이미지. Dockerfile의 FROM tag@digest를 올리는 PR을 만들고, 머지하면 CI의 Trivy가 검사한다.
  # 업스트림이 같은 태그를 매주 다시 빌드해서 digest만 바뀐 PR이 주기적으로 오는 게 정상이다. images/s5-vuln은 일부러 낡게 둔 비교용이라 뺀다.
  - package-ecosystem: "docker"
    directory: "/images/s5-good"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # nginx는 짝수 minor가 stable, 홀수가 mainline이다. 패치와 digest 갱신만 자동으로 받고
      # minor 이상(예: 1.30에서 1.31 mainline)은 stable인지 보고 사람이 올린다.
      - dependency-name: "*nginx-unprivileged"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
