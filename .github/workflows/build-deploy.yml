# ============================================================
# .github/workflows/build-deploy.yml — Stage 6 CI/CD
# ============================================================
# S5 의 로컬 골든패스를 러너가 실행하고(S6-A), 검증된 아티팩트를
# EKS 에 롤아웃한다(S6-B). 절차는 같고 실행 주체만 바뀐다.
#
# 두 job 의 러너가 다른 이유:
#   build  : GitHub 호스티드 — 인터넷만 있으면 됨(ECR·GitHub)
#   deploy : CodeBuild(VPC) — EKS 엔드포인트가 관리자 IP /32 로 제한돼 있어
#            GitHub 러너로는 도달 불가. 러너 IP 대역을 allowlist 에 추가하는 대신
#            컴퓨트를 VPC 안으로 옮긴다(D33).
#
# 소유권 (D42 Delegated Field Ownership):
#   Terraform → Deployment 의 구조·보안(replica·probe·볼륨·SA·securityContext)
#   CI        → 컨테이너 image 필드 하나
#   → CI 는 Terraform state 를 건드리지 않고, K8s 권한도 이 Deployment 의
#     get/patch 로 한정된다.
#
# ★ 모든 액션을 커밋 SHA 로 핀한다 (P1-5):
#   태그(@v4)는 가변이다 — 2026.3 사건에서 공격자가 trivy-action 의 버전 태그
#   76개를 악성 커밋으로 force-push 했다. 태그 참조는 그 순간 악성 코드를 실행한다.
#   SHA 는 내용에 고정되므로 이 공격에 면역이다.
#   → S5 의 ECR IMMUTABLE, S7 의 digest 서명과 같은 원리(이름이 아니라 내용으로 식별).
#   ⚠ 핀만 하고 방치하면 오래된 액션을 쓰게 된다 → .github/dependabot.yml 로 자동 추적.
#   Stage 6에서 실제 검증한 액션 SHA를 유지하고, Stage 7 신규 cosign-installer도
#   40자리 SHA로 고정했다. Dependabot으로 업데이트 후보만 추적하고 자동 반영하지 않는다.
#
# 사전 준비 (레포 Variables):
#   AWS_BUILD_ROLE_ARN   00-bootstrap output: github_actions_build_role_arn
#   AWS_DEPLOY_ROLE_ARN  00-bootstrap output: github_actions_deploy_role_arn
#   CODEBUILD_RUNNER     02-security output: codebuild_runner_project_name
#   DEPLOY_ENABLED       "true" 로 설정해야 deploy job 실행 (S6-B 인프라 준비 후)
# ============================================================

name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/build-deploy.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "빌드할 이미지 (vuln 은 게이트 차단 실증용 — 푸시되지 않아야 정상)"
        type: choice
        options: ["good", "vuln"]
        default: "good"

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  # ══════════════════════════════════════════════════════════
  # S6-A — 빌드 / 스캔 / 푸시 / SBOM   (클러스터 불필요)
  # ══════════════════════════════════════════════════════════
  build:
    name: Build, Scan, Push
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      image_uri: ${{ steps.digest.outputs.uri }}
      image_digest_uri: ${{ steps.digest.outputs.digest_uri }}
      digest: ${{ steps.digest.outputs.value }}

    steps:
      # egress 감사 — 빌드 중 예기치 않은 외부 통신을 관측 가능하게.
      # 2026.3 Trivy 태그 오염 같은 공격이 러너에서 자격증명을 유출하는
      # 경로를 잡는 통제(4A.5 자산).
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # OIDC — 장기 키 없음. 빌드 전용 역할(ECR 리포 하나에만 push).
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - name: Resolve ECR repository (SSM contract)
        id: repo
        run: |
          REPO_URL=$(aws ssm get-parameter \
            --name "/devsecops-project/security/ecr_repository_url" \
            --query "Parameter.Value" --output text)
          {
            echo "url=${REPO_URL}"
            echo "registry=${REPO_URL%%/*}"
            echo "name=${REPO_URL#*/}"
          } >> "$GITHUB_OUTPUT"

      # ── 태그 규약 ─────────────────────────────────────────
      #   S5: s5-<variant>-<sha>  (로컬)
      #   S6: s6-<sha>            (CI, 정상 경로)
      #       s6-vuln-<sha>       (게이트 차단 실증 — 푸시에 도달하지 않음)
      #   S7: repo@sha256:<digest>
      # latest 미사용: 어느 커밋의 산출물인지 식별 불가 + IMMUTABLE 충돌.
      # full commit SHA 를 쓴다(7자리 축약 아님) — 축약은 이론상 충돌 가능하고,
      # IMMUTABLE 리포지토리에서 태그 충돌은 곧 푸시 실패다.
      - name: Compute image tag
        id: tag
        env:
          VARIANT: ${{ inputs.variant || 'good' }}
        run: |
          if [ "$VARIANT" = "good" ]; then
            echo "value=s6-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "value=s6-vuln-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"

      # ── IMMUTABLE ↔ rerun 충돌 해소 (P1-4) ────────────────
      # 같은 커밋을 rerun 하면 태그가 같아 푸시가 거부된다.
      # immutable 정책을 푸는 대신, 이미 있으면 **기존 아티팩트를 재사용**한다.
      #   없음 → build → scan → push
      #   있음 → 전부 생략, digest 만 조회해서 deploy 로 넘김
      # 재현성 관점에서도 옳다: 같은 커밋은 같은 아티팩트를 가리켜야 한다.
      - name: Check if image already exists
        id: exists
        run: |
          if aws ecr describe-images \
              --repository-name "${{ steps.repo.outputs.name }}" \
              --image-ids imageTag="${{ steps.tag.outputs.value }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "이미 존재하는 아티팩트 — 빌드·스캔·푸시를 생략하고 재사용한다"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 멱등성: 같은 커밋 rerun 대비 (P1-4) ───────────────
      # IMMUTABLE 리포지토리라 같은 태그 재푸시는 거부된다.
      # 같은 커밋을 rerun 하면 태그가 동일하므로 push 에서 실패한다.
      # → immutable 정책을 푸는 대신, 이미 있으면 빌드·푸시를 건너뛰고
      #   기존 digest 를 재사용해 배포만 다시 수행한다.
      - name: Set up Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      # --provenance/--sbom false (트러블슈팅 #18):
      #   buildx 기본 attestation 은 태그를 Image Index 에 붙이는데 Inspector 가
      #   인덱스를 스캔하지 못해(UNSUPPORTED_MEDIA_TYPE) "스캔은 됐는데 태그별
      #   결과가 안 보이는" 상태가 된다. SBOM 은 아래에서 digest 기준 별도 생성.
      - name: Build image
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: images/s5-${{ steps.tag.outputs.variant }}
          platforms: linux/amd64
          # 빌드 identity 를 이미지에 굽는다 (P1-6) —
          # 페이지에 커밋 SHA 가 나타나 commit→image→pod→HTTPS 가 눈으로 연결된다
          build-args: |
            BUILD_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          push: false
          load: true
          tags: ${{ steps.repo.outputs.url }}:${{ steps.tag.outputs.value }}

      # ── ★ 빌드타임 게이트 (BREAK 축) ──────────────────────
      # S5 에서 이 게이트가 실제 CVE(CVE-2026-14456)를 잡아 차단했다.
      # CI 에서도 막는지가 "절차를 그대로 자동화했다"의 증명.
      # 실패 시 워크플로 중단 → 푸시·배포 단계에 도달하지 않음.
      #
      # ⚠ trivy-action 은 2026.3 태그 오염 사건의 당사자다(버전 태그 76개가
      #   악성 커밋으로 force-push 됨). 태그가 아니라 커밋 SHA 로 핀한다.
      #   ★ 배포 전 실제 릴리스 커밋 SHA 로 교체:
      #     git ls-remote https://github.com/aquasecurity/trivy-action refs/tags/*
      - name: Trivy vulnerability gate
        if: steps.exists.outputs.found == 'false'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ steps.repo.outputs.url }}:${{ steps.tag.outputs.value }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"

      - name: Login to ECR
        if: steps.exists.outputs.found == 'false'
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ steps.repo.outputs.registry }}"

      - name: Push image
        if: steps.exists.outputs.found == 'false'
        run: docker push "${{ steps.repo.outputs.url }}:${{ steps.tag.outputs.value }}"

      # digest = 이미지의 신원. 태그는 이름일 뿐이고, SBOM·서명(S7)의 기준은 digest.
      - name: Resolve pushed digest
        id: digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ steps.repo.outputs.name }}" \
            --image-ids imageTag="${{ steps.tag.outputs.value }}" \
            --query "imageDetails[0].imageDigest" --output text)
          {
            echo "value=${DIGEST}"
            echo "uri=${{ steps.repo.outputs.url }}:${{ steps.tag.outputs.value }}"
            echo "digest_uri=${{ steps.repo.outputs.url }}@${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      # SBOM 은 "레지스트리에 실제로 올라간 것"을 대상으로 생성한다.
      # 로컬 이미지와 레지스트리가 어긋날 여지를 없애고 S7 서명 대상과 일치시킴.
      # ⚠ SBOM 은 rerun 에서도 항상 생성한다 (recovery path):
      #   빌드·푸시는 아티팩트가 이미 있으면 건너뛰지만, SBOM 아티팩트는
      #   보존 기간(90일) 만료나 실수로 유실될 수 있다. digest 는 조회 가능하므로
      #   같은 digest 기준으로 언제든 재생성할 수 있어야 한다.
      #   → 이 스텝에는 exists 조건을 걸지 않는다.
      # ══ Stage 7: cosign KMS 서명 ══════════════════════════
      # 서명 대상은 태그가 아니라 digest 다. 태그는 이름이고 digest 가 신원이며,
      # Kyverno 가 검증하는 것도, 파드가 실행하는 것도 같은 digest 여야 한다.
      #   D = sha256:...  → sign(D) = deploy(D) = verify(D) = run(D)

      # ── ① 빌드 역할의 레지스트리 자격증명 폐기 (P0) ──────
      # ⚠ AWS 자격증명을 sign 역할로 바꿔도 ~/.docker/config.json 의 ECR 토큰은
      #   **그대로 남는다.** 그 상태로 서명하면
      #     IAM 신원 = gha-sign / 실제 registry write = gha-build 토큰
      #   이 되어, 역할은 분리했는데 **레지스트리 쓰기 경계가 흐려진다.**
      #   S7 의 "서명 권한 분리" 논지가 반쪽이 되므로 명시적으로 로그아웃한다.
      # ══ ⑥ Amazon Inspector 배포 게이트 (G7) ══════════════════
      # ★ exists 조건을 걸지 않는다 — 재사용 경로에서도 반드시 실행한다.
      #   재사용 시 ②Build·③Trivy·④Push 가 모두 생략되므로, 이 게이트가 없으면
      #   빌드 이후 새로 발견된 CVE 가 있는 이미지를 그대로 재배포하게 된다.
      #
      # 역할 분담:
      #   Trivy     빌드타임, 신규 이미지만     — 푸시 전 차단
      #   Inspector 레지스트리 지속 재평가     — 재배포 포함 ★
      #
      # 서명과의 관계:
      #   서명은 "서명 당시 신뢰했다"는 시점 증명이고,
      #   Inspector 는 "지금도 안전한가"를 지속 평가한다.
      #   이미 서명된 baseline 도 나중에 CVE 가 나올 수 있다.
      #   → 이 게이트는 ⑦ 서명보다 앞에 둔다. 신뢰할 수 없는 것에 서명하지 않는다.
      #
      # ⚠ Inspector 는 비동기다(S5 에서 PENDING_INITIAL_SCAN 관측).
      #   스캔 완료까지 polling 하고, timeout 이면 **fail-closed** —
      #   결과를 모르는 이미지를 통과시키지 않는다.
      - name: Inspector gate (scan completion + findings)
        env:
          REPO_NAME: ${{ steps.repo.outputs.name }}
          DIGEST: ${{ steps.digest.outputs.value }}
          MAX_WAIT: "600"   # 10분
        run: |
          set -euo pipefail
          echo "== ⑥ Inspector gate: ${REPO_NAME}@${DIGEST}"

          # (a) 스캔 완료 대기
          waited=0
          while true; do
            reason=$(aws inspector2 list-coverage \
              --filter-criteria "{\"ecrImageTags\":[],\"resourceType\":[{\"comparison\":\"EQUALS\",\"value\":\"AWS_ECR_CONTAINER_IMAGE\"}],\"ecrRepositoryName\":[{\"comparison\":\"EQUALS\",\"value\":\"${REPO_NAME}\"}]}" \
              --query "coveredResources[?contains(resourceId, '${DIGEST#sha256:}')].scanStatus.reason | [0]" \
              --output text 2>/dev/null || echo "None")
            echo "  scan status: ${reason} (${waited}s)"
            if [ "$reason" = "SUCCESSFUL" ]; then break; fi
            if [ "$waited" -ge "$MAX_WAIT" ]; then
              echo "::error::Inspector 스캔이 ${MAX_WAIT}s 내에 완료되지 않음 — fail-closed"
              exit 1
            fi
            sleep 20; waited=$((waited+20))
          done

          # (b) 차단 기준 평가
          #   CRITICAL / HIGH 중 수정 버전이 있는 것 (Trivy 기준과 정합)
          #   + Platform EOL(IN-DISCONTINUED-*) — 패치 자체가 없으므로 무조건 차단
          findings=$(aws inspector2 list-findings \
            --filter-criteria "{\"ecrImageHash\":[{\"comparison\":\"EQUALS\",\"value\":\"${DIGEST}\"}],\"findingStatus\":[{\"comparison\":\"EQUALS\",\"value\":\"ACTIVE\"}],\"severity\":[{\"comparison\":\"EQUALS\",\"value\":\"CRITICAL\"},{\"comparison\":\"EQUALS\",\"value\":\"HIGH\"}]}" \
            --query "findings[?fixAvailable=='YES' || starts_with(packageVulnerabilityDetails.vulnerabilityId, 'IN-DISCONTINUED')].{id:packageVulnerabilityDetails.vulnerabilityId,sev:severity,fix:fixAvailable}" \
            --output json)
          count=$(echo "$findings" | jq 'length')
          echo "  blocking findings: ${count}"
          if [ "$count" -gt 0 ]; then
            echo "$findings" | jq -r '.[] | "  \(.sev)\t\(.id)\tfix=\(.fix)"'
            echo "::error::Inspector 차단 기준 해당 finding ${count}건 — 배포 중단"
            exit 1
          fi
          echo "  ✅ Inspector gate PASS"

      - name: Logout build registry credentials
        run: docker logout "${{ steps.repo.outputs.registry }}"

      # ── ② 서명 전용 역할로 전환 ──────────────────────────
      # 빌드 역할에 kms:Sign 을 얹지 않는 이유: 빌드 경로 침해가 곧 임의 서명이
      # 되면 admission 통제 전체가 무력화된다. 서명 권한 분리가 S7 의 하중을 진다.
      - name: Configure AWS Credentials (sign role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_SIGN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-sign-${{ github.run_id }}

      # ── ③ sign 역할 기준으로 ECR 재로그인 ────────────────
      # cosign 은 서명값 생성(KMS)에 더해 **아티팩트를 ECR 에 push** 한다.
      # 이 토큰이 sign 역할에서 발급돼야 IAM 경계와 레지스트리 경계가 일치한다.
      - name: Login to ECR (sign role)
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ steps.repo.outputs.registry }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.3'
          # ⚠ 버전을 명시적으로 고정한다. cosign 의 서명 저장 방식(레거시 태그 vs
          #   OCI 1.1 referrers)은 버전·레지스트리 지원 여부·플래그에 따라 달라지므로
          #   "vN 은 X 방식"으로 단정하지 않는다.
          #   → 대신 아래 "Prove signature storage" 에서 **실제 저장 결과를 관측**해
          #     기록하고, 그 관측값을 기준으로 Kyverno 검증 호환성을 판단한다.

      - name: Resolve signing material
        id: signkey
        run: |
          KEY_ARN=$(aws ssm get-parameter \
            --name "/devsecops-project/security/signing_key_arn" \
            --query "Parameter.Value" --output text)
          echo "uri=awskms:///${KEY_ARN}" >> "$GITHUB_OUTPUT"
          # ★ 공개키 PEM — Kyverno 가 쓸 것과 **동일한** 검증 material
          aws ssm get-parameter \
            --name "/devsecops-project/security/signing_public_key_pem" \
            --query "Parameter.Value" --output text > cosign.pub
          echo "--- verification material (public) ---"; cat cosign.pub

      # ── 서명 멱등성: "verify 실패 = unsigned" 로 단정하지 않는다 ──────
      # registry/network/PEM 오류까지 unsigned 로 오판해 재서명하면 failure mode를 숨긴다.
      # 먼저 ECR의 subject→referrer 관계를 직접 조회한다.
      - name: Inspect existing Sigstore referrers
        id: sigref
        env:
          REPO_NAME: ${{ steps.repo.outputs.name }}
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          set -euo pipefail
          aws ecr list-image-referrers \
            --repository-name "$REPO_NAME" \
            --subject-id imageDigest="$DIGEST" \
            --output json > ecr-referrers-before.json

          COUNT=$(jq '[.referrers[]? | select(.artifactStatus == "ACTIVE" and ((.artifactType // "") | contains("sigstore")))] | length' ecr-referrers-before.json)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "ACTIVE Sigstore referrer 존재 — 재서명하지 않고 기존 서명을 검증한다"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Sigstore referrer 없음 — 최초 서명을 수행한다"
          fi

      # 기존 referrer가 있다면 검증 실패를 재서명으로 덮지 않는다.
      - name: Verify existing signature (fail closed)
        if: steps.sigref.outputs.found == 'true'
        run: |
          cosign verify --key cosign.pub --insecure-ignore-tlog=true \
            "${{ steps.repo.outputs.url }}@${{ steps.digest.outputs.value }}"

      - name: Sign image digest
        if: steps.sigref.outputs.found == 'false'
        run: |
          # ⚠ D44: 투명성 로그(Rekor) 미사용 — 로컬 baseline 서명과 같은 계약.
          #   KMS 장기 키 + 정적 PEM 검증이므로 Rekor 가 증명하는
          #   "서명 당시 인증서 유효성"이 필요 없고, 프라이빗 아티팩트의
          #   digest 를 공개 로그에 영구 게시하지 않는다.
          #   cosign v3.1 은 --tlog-upload 를 deprecated → signing-config 방식.
          # ⚠ 반드시 아래 verify 의 --insecure-ignore-tlog 와 **함께** 바꾼다(#23).
          #   서명만 바꾸면 검증이 "0 < 1" 로 실패한다.
          cosign sign --yes \
            --signing-config .github/cosign/signing-config.json \
            --key "${{ steps.signkey.outputs.uri }}" \
            "${{ steps.repo.outputs.url }}@${{ steps.digest.outputs.value }}"

      # ── ④ 검증은 정적 PEM 으로 (KMS URI 아님) ────────────
      # CI와 Kyverno가 동일한 trust material을 사용해야 Sign(D)=Verify(D)의
      # failure domain을 분리할 수 있다.
      - name: Verify signature with static public key (pre-admission)
        run: |
          cosign verify --key cosign.pub --insecure-ignore-tlog=true \
            "${{ steps.repo.outputs.url }}@${{ steps.digest.outputs.value }}"

      # ── ⑤ ECR API로 OCI 1.1 referrer를 직접 증명 ───────────
      # .sig tag의 부재나 cosign 해석 결과만으로 추론하지 않는다.
      - name: Prove signature attachment with ECR referrer API
        env:
          REPO_NAME: ${{ steps.repo.outputs.name }}
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          set -euo pipefail
          aws ecr list-image-referrers \
            --repository-name "$REPO_NAME" \
            --subject-id imageDigest="$DIGEST" \
            --output json > ecr-referrers.json
          cat ecr-referrers.json

          COUNT=$(jq '[.referrers[]? | select(.artifactStatus == "ACTIVE" and ((.artifactType // "") | contains("sigstore")))] | length' ecr-referrers.json)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::ACTIVE Sigstore referrer가 확인되지 않음"
            exit 1
          fi
          echo "ACTIVE Sigstore referrer count=${COUNT}"

          # 사람이 보기 좋은 보조 evidence. 판정의 기준은 위 AWS API 결과다.
          cosign tree "${{ steps.repo.outputs.url }}@${{ steps.digest.outputs.value }}" || true

      # ── ⑥ 빌드 역할 복귀 (SBOM 은 ECR 읽기 필요) ─────────
      - name: Logout sign registry credentials
        run: docker logout "${{ steps.repo.outputs.registry }}"

      - name: Configure AWS Credentials (build role, restore)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-restore-${{ github.run_id }}

      - name: Login to ECR (build role, restore)
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ steps.repo.outputs.registry }}"

      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ steps.repo.outputs.url }}@${{ steps.digest.outputs.value }}
          format: cyclonedx-json
          output-file: sbom-${{ steps.tag.outputs.value }}.cdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-${{ steps.tag.outputs.value }}
          path: sbom-${{ steps.tag.outputs.value }}.cdx.json
          retention-days: 90

      # ⚠ SBOM 을 OCI attestation 으로 붙이지 않는다 — S7 의 주제다.
      #   S6: 생성 + 보존 + digest 결합 / S7: 서명·attestation·admission 검증

  # ══════════════════════════════════════════════════════════
  # S6-B — 배포   (VPC 내부 ephemeral 러너, EKS 프라이빗 경로)
  # ══════════════════════════════════════════════════════════
  deploy:
    name: Deploy to EKS
    needs: build

    # ★ 신뢰 경계 3중 방어:
    #   ① 이 조건 — main push 에서만 (PR 이벤트 자체가 배포 job 을 만들지 않음)
    #   ② gha-deploy-role 의 신뢰정책 — sub 가 main ref 로 핀 (PR 은 수임 불가)
    #   ③ (권장) GitHub Environment 보호 규칙
    #   향후 public 전환 시 fork PR 이 프라이빗 러너를 실행하지 못하게 하는 장치.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && (inputs.variant || 'good') == 'good'

    # CodeBuild-hosted ephemeral 러너 — job 마다 뜨고 끝나면 사라진다.
    # 상시 EC2 러너 대비: 수명주기·패치·등록·유휴 비용이 없다.
    runs-on: codebuild-${{ vars.CODEBUILD_RUNNER }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # ★ 러너가 CodeBuild 컴퓨트여도 AWS 접근은 GitHub OIDC 를 쓴다.
      #   CodeBuild 서비스 역할은 러너 배관(ENI/로그)만 담당 —
      #   컴퓨트 신원과 배포 신원의 분리가 이 설계의 핵심.
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      # 이 역할의 AWS 권한은 eks:DescribeCluster 하나뿐.
      # K8s 권한은 access entry(04) + Role/RoleBinding(05)이 결정한다.
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name joshua-eks

      # ── ★ RBAC 실증 (P1-7) — 실제 CI 신원으로 ────────────
      # `--as-group` 임퍼소네이션은 "그룹에 무엇이 바인딩됐나"만 본다.
      # 여기서는 **실제로 수임된 신원**(GitHub OIDC → gha-deploy-role →
      # EKS access entry → ci-deployer 그룹 → RoleBinding)으로 검사하므로
      # 전 경로가 한 번에 검증된다.
      # 실패해도 배포를 막지 않는다(증거 수집이 목적) — continue-on-error.
      # ── ⑤ SCOPE: 실제 CI 신원의 권한 경계 ────────────────
      # impersonation 이 아니라 **러너에서 실제 신원으로** 실행한다 —
      # OIDC → deploy 역할 → access entry → 그룹 → RoleBinding → RBAC 전 경로 검증.
      - name: Verify least privilege (positive / negative)
        run: |
          # ⚠ kubectl auth can-i 는 "no" 일 때 exit 1 을 반환한다.
          #   그대로 나열하면 첫 negative 에서 스텝이 끊겨 뒤쪽 증거가 수집되지 않는다.
          #   → 결과를 캡처해 **끝까지 수행**하되, 불일치가 하나라도 있으면
          #     마지막에 exit 1 한다(fail-final).
          #   ★ 이전 방식은 exit code 를 완전히 삼켜서, 과도한 권한이 생겨도
          #     파이프라인이 초록불로 끝났다 — 검증이 아니라 관측에 그쳤다.
          FAILED=0
          check() {  # $1=기대(yes|no)  $2..=kubectl 인자
            local want="$1"; shift
            local got; got=$(kubectl auth can-i "$@" 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              printf 'OK  expect=%-3s got=%-3s : %s\n' "$want" "$got" "$*"
            else
              printf '!!  expect=%-3s got=%-3s : %s\n' "$want" "$got" "$*"
              FAILED=1
            fi
          }

          echo "whoami: $(aws sts get-caller-identity --query Arn --output text)"
          echo "--- positive ---"
          check yes patch deployment/nginx -n default
          echo "--- negative ---"
          check no  get secrets -n default
          check no  get secrets -n kube-system
          check no  delete networkpolicies -n default
          check no  create pods/exec -n default
          check no  patch deployment/netpol-client -n default

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::RBAC 경계가 기대와 다르다 — 과도한 권한 또는 누락"
            exit 1
          fi

      - name: Capture current image
        id: before
        run: |
          CURRENT=$(kubectl get deployment nginx -n default \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "image=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "배포 전: ${CURRENT}"

      # ── 롤아웃 — image 필드 하나만 변경 ───────────────────
      # Terraform 은 이 필드를 ignore_changes 로 위임했으므로(D42) drift 가 아니다.
      # 다른 필드(replica·probe·볼륨)는 Terraform 이 계속 소유한다.
      # RBAC 상 이 Deployment 의 patch 만 가능 — 다른 객체는 손댈 수 없다.
      - name: Roll out image
        run: |
          # ★ S7: 태그가 아니라 digest 로 배포한다.
          #   정책의 verifyDigest=true 가 태그 참조를 거부하므로 필수이며,
          #   서명 대상과 배포 대상이 같은 digest 임을 보장한다.
          kubectl set image deployment/nginx \
            nginx="${{ needs.build.outputs.image_digest_uri }}" -n default

      - name: Wait for rollout
        run: kubectl rollout status deployment/nginx -n default --timeout=180s

      # 실제로 의도한 이미지가 도는지 확인 (기록된 것과 실행된 것의 일치)
      - name: Verify deployed image
        run: |
          DEPLOYED=$(kubectl get deployment nginx -n default \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "배포 후: ${DEPLOYED}"
          [ "${DEPLOYED}" = "${{ needs.build.outputs.image_digest_uri }}" ] || {
            echo "::error::배포된 이미지가 빌드 산출물과 다름"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 이전 | \`${{ steps.before.outputs.image }}\` |"
            echo "| 현재 | \`${{ needs.build.outputs.image_digest_uri }}\` |"
            echo "| digest | \`${{ needs.build.outputs.digest }}\` |"
            echo ""
            echo "페이지의 Build 값이 위 커밋과 일치하면"
            echo "commit → image → ECR → deployment → pod → HTTPS 가 한 줄로 연결된다."
            echo "외부 경계(CloudFront/WAF/ALB/Okta) E2E 확인은 수동."
          } >> "$GITHUB_STEP_SUMMARY"
