# build는 GitHub 호스티드 러너, deploy는 VPC 안 CodeBuild 러너에서 돈다. EKS 엔드포인트가 관리자 IP로만 열려 있어서 GitHub 러너로는 못 닿는다.
# 필요한 Repository variables는 README의 "GitHub 저장소 설정"에 있다.

name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/build-deploy.yml"
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: variant 는 good/vuln 선택지뿐(choice). vuln 은 Trivy 게이트 차단 실증용으로 푸시 전에 막히고, 배포 job 은 good 일 때만 실행된다 (deploy 의 if 조건)
    inputs:
      variant:
        description: "빌드할 이미지 (vuln 은 게이트 차단 실증용 — 푸시되지 않아야 정상)"
        type: choice
        options: ["good", "vuln"]
        default: "good"

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    name: Build, Scan, Push
    # ubuntu-latest가 Ubuntu 26으로 바뀌어도 실행 환경이 갑자기 달라지지 않게 버전을 고정한다.
    runs-on: ubuntu-24.04

    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      image_uri: ${{ steps.digest.outputs.uri }}
      digest: ${{ steps.digest.outputs.value }}

    steps:
      # egress 감사. 빌드 중에 예상 못 한 외부 통신이 생기면 보이게 한다(러너에서 자격증명이 새는 경우 대비).
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # OIDC라 장기 키가 없다. 빌드 전용 역할이고 ECR 리포 하나에만 push할 수 있다.
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - name: Resolve ECR repository (SSM contract)
        id: repo
        run: |
          REPO_URL=$(aws ssm get-parameter \
            --name "/devsecops-project/security/ecr_repository_url" \
            --query "Parameter.Value" --output text)
          {
            echo "url=${REPO_URL}"
            echo "registry=${REPO_URL%%/*}"
            echo "name=${REPO_URL#*/}"
          } >> "$GITHUB_OUTPUT"

      # 태그 규칙: CI는 s6-<전체 sha>, 차단 실증용은 s6-vuln-<sha>(푸시까지 안 감), 로컬 스크립트는 s5-<variant>-<sha>.
      # latest는 안 쓴다. 어느 커밋에서 나온 건지 알 수 없고 IMMUTABLE이랑 부딪힌다. 짧은 SHA는 겹칠 수 있어서 전체 SHA를 쓴다.
      - name: Compute image tag
        id: tag
        env:
          VARIANT: ${{ inputs.variant || 'good' }}
        run: |
          if [ "$VARIANT" = "good" ]; then
            echo "value=s6-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "value=s6-vuln-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"

      # 같은 커밋을 다시 돌리면 태그가 겹쳐서 IMMUTABLE에 막힌다. 이미 올라가 있으면 빌드·스캔·푸시를 건너뛰고 그 digest를 그대로 쓴다.
      - name: Check if image already exists
        id: exists
        run: |
          if aws ecr describe-images \
              --repository-name "${{ steps.repo.outputs.name }}" \
              --image-ids imageTag="${{ steps.tag.outputs.value }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "이미 존재하는 아티팩트 — 빌드·스캔·푸시를 생략하고 재사용한다"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # 베이스 이미지는 빌드 역할로 로그인해서 받는다. GitHub 러너는 IP를 여럿이 같이 써서 익명으로 받으면 한도("toomanyrequests")에 걸릴 수 있다.
      # ECR Public 토큰은 us-east-1에서만 나온다(권한은 02 ecr_push_policy.tf, 토큰 발급만 가능).
      - name: Login to ECR Public (base image pull)
        if: steps.exists.outputs.found == 'false'
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      # --provenance/--sbom false: 기본 attestation을 켜면 태그가 Image Index에 붙어서 Inspector가 스캔을 못 한다(UNSUPPORTED_MEDIA_TYPE).
      # SBOM은 아래에서 digest 기준으로 따로 만든다.
      - name: Build image
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: images/s5-${{ steps.tag.outputs.variant }}
          platforms: linux/amd64
          # 빌드한 커밋 SHA를 이미지에 넣는다. 페이지에 SHA가 찍혀서 커밋, 이미지, 파드, HTTPS 응답이 눈으로 이어진다.
          build-args: |
            BUILD_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          push: false
          load: true
          tags: ${{ steps.repo.outputs.url }}:${{ steps.tag.outputs.value }}

      # 빌드 단계 게이트. 여기서 걸리면 푸시도 배포도 안 간다.
      # trivy-action은 2026년 3월 태그 오염 사건(버전 태그 76개가 force-push됨)의 당사자라 태그 대신 커밋 SHA로 고정한다.
      - name: Trivy vulnerability gate
        if: steps.exists.outputs.found == 'false'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          image-ref: ${{ steps.repo.outputs.url }}:${{ steps.tag.outputs.value }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"

      # rerun 때도 Syft가 private ECR에 있는 기존 digest를 다시 읽어야 해서 로그인이 필요하다. 그래서 항상 로그인한다.
      - name: Login to ECR (push / SBOM read)
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${{ steps.repo.outputs.registry }}"

      - name: Push image
        if: steps.exists.outputs.found == 'false'
        run: docker push "${{ steps.repo.outputs.url }}:${{ steps.tag.outputs.value }}"

      # digest가 이미지의 진짜 식별자다. 태그는 이름표일 뿐이고 SBOM도 digest 기준으로 만든다.
      - name: Resolve pushed digest
        id: digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "${{ steps.repo.outputs.name }}" \
            --image-ids imageTag="${{ steps.tag.outputs.value }}" \
            --query "imageDetails[0].imageDigest" --output text)
          {
            echo "value=${DIGEST}"
            # 롤아웃도 tag@digest로 한다. 05의 기준 이미지와 같은 형식
            echo "uri=${{ steps.repo.outputs.url }}:${{ steps.tag.outputs.value }}@${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      # SBOM은 레지스트리에 실제로 올라간 digest를 기준으로 만든다.
      # rerun에서도 항상 만든다(exists 조건 없음). 빌드·푸시는 건너뛰어도 SBOM 아티팩트는 보존 기간 90일이 지나면 사라지기 때문이다.
      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ steps.repo.outputs.url }}@${{ steps.digest.outputs.value }}
          format: cyclonedx-json
          output-file: sbom-${{ steps.tag.outputs.value }}.cdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-${{ steps.tag.outputs.value }}
          path: sbom-${{ steps.tag.outputs.value }}.cdx.json
          retention-days: 90

      # SBOM을 OCI attestation으로 붙이지는 않는다. 서명·attestation 검증은 README "한계와 다음 단계"에 있다.

  deploy:
    name: Deploy to EKS
    needs: build

    # 배포는 main push일 때만 돈다(PR 이벤트로는 이 job이 아예 안 생긴다). deploy 역할의 신뢰 정책도 main 브랜치로 묶여 있다.
    # 나중에 저장소를 공개해도 포크 PR이 프라이빗 러너를 못 돌리게 막는 장치다.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && (inputs.variant || 'good') == 'good'

    # CodeBuild 러너는 job마다 새로 떴다가 끝나면 사라진다.
    runs-on: codebuild-${{ vars.CODEBUILD_RUNNER }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      # 러너가 CodeBuild여도 AWS 접근은 GitHub OIDC(deploy 역할)로 한다. CodeBuild 서비스 역할은 러너를 띄우는 데만 쓴다.
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      # 이 역할의 AWS 권한은 eks:DescribeCluster 하나뿐이다.
      # K8s 권한은 접근 항목(04)과 Role/RoleBinding(05)이 정한다.
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name joshua-eks

      # RBAC 점검. --as-group으로 흉내 내는 게 아니라 실제로 받은 자격(OIDC, deploy 역할, 접근 항목, ci-deployer, RoleBinding)으로 확인해서 전체 경로를 한 번에 본다.
      # 결과를 다 모은 다음, 하나라도 기대랑 다르면 마지막에 실패시킨다.
      - name: Verify least privilege (positive / negative)
        run: |
          failures=0
          check() {  # $1=expected(yes|no), $2..=kubectl auth can-i args
            local want="$1"; shift
            local got
            got=$(kubectl auth can-i "$@" 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              printf 'OK  expect=%-3s got=%-3s : %s\n' "$want" "$got" "$*"
            else
              printf '!!  expect=%-3s got=%-3s : %s\n' "$want" "$got" "$*"
              failures=$((failures + 1))
            fi
          }

          echo "whoami: $(aws sts get-caller-identity --query Arn --output text)"
          echo "--- positive ---"
          check yes patch deployment/nginx -n app
          echo "--- negative ---"
          check no  get secrets -n app
          check no  get secrets -n kube-system
          check no  delete networkpolicies -n app
          check no  create pods/exec -n app
          # default의 데모는 CI 권한 밖이다. CI Role은 app에만 있다.
          check no  patch deployment/netpol-client -n default

          if [ "$failures" -ne 0 ]; then
            echo "::error::RBAC acceptance mismatch: ${failures} check(s)"
            exit 1
          fi

      # 지금 이미지를 기록해 둔다. 롤백 지점이면서 바뀐 증거다.
      - name: Capture current image
        id: before
        run: |
          CURRENT=$(kubectl get deployment nginx -n app \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "image=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "배포 전: ${CURRENT}"

      # 롤아웃. image 필드 하나만 바꾼다. Terraform이 이 필드는 CI에 맡겨 뒀고(05 workload.tf), RBAC상 이 Deployment patch만 할 수 있다.
      - name: Roll out image
        run: |
          kubectl set image deployment/nginx \
            nginx="${{ needs.build.outputs.image_uri }}" -n app

      - name: Wait for rollout
        run: kubectl rollout status deployment/nginx -n app --timeout=180s

      # 의도한 이미지가 실제로 도는지 확인한다(기록한 것과 돌고 있는 것이 같은지).
      - name: Verify deployed image
        run: |
          DEPLOYED=$(kubectl get deployment nginx -n app \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "배포 후: ${DEPLOYED}"
          [ "${DEPLOYED}" = "${{ needs.build.outputs.image_uri }}" ] || {
            echo "::error::배포된 이미지가 빌드 산출물과 다름"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 이전 | \`${{ steps.before.outputs.image }}\` |"
            echo "| 현재 | \`${{ needs.build.outputs.image_uri }}\` |"
            echo "| digest | \`${{ needs.build.outputs.digest }}\` |"
            echo ""
            echo "페이지의 Build 값이 위 커밋과 일치하면"
            echo "commit → image → ECR → deployment → pod → HTTPS 가 한 줄로 연결된다."
            echo "외부 경계(CloudFront/WAF/ALB/Okta) E2E 확인은 수동."
          } >> "$GITHUB_STEP_SUMMARY"
