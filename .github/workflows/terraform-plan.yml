# guard 잡은 CI 자격으로 허용·거부 호출을 실제로 해 본다.
# 진짜 통제는 IAM 정책(00, 로컬 apply)이고, 가드는 그 통제가 다시 넓어지면 PR에서 바로 잡아내는 회귀 탐지다. 가드를 지워도 통제는 남는다.
# paths 필터는 안 둔다. 모든 PR에서 가드가 돌아서 경계를 계속 확인한다.

name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write  # OIDC 토큰 받기
  contents: read        # 레포 체크아웃
  pull-requests: write  # PR에 plan 결과 코멘트

env:
  AWS_REGION: ap-northeast-2
  PROJECT: devsecops-project
  # 민감하지 않은 변수는 TF_VAR_ 환경변수로 넣는다(tfvars는 git에 안 올림).
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}

jobs:
  # CI 자격의 권한 경계를 실제 호출로 확인한다
  guard:
    name: Least privilege guard
    # ubuntu-latest가 Ubuntu 26으로 바뀌어도 실행 환경이 갑자기 달라지지 않게 버전을 고정한다.
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS Credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-guard

      # 거부 12개 = state·시크릿 경로 8 + 감사 기록 내용 3 + 잠금 쓰기 1
      #   state·시크릿: 03·05 state, 03 목록, Okta 시크릿, CloudFront 설정 2, ALB 규칙, WAF 조회
      #   감사 기록: EKS 감사 로그 읽기, Logs Insights 쿼리 실행, Athena 로그 조회
      # S3 거부(03·05 state)는 403이면 통과로 본다. ListBucket이 없으면 객체가 없어도 403이 오니까, 객체가 있을 때만 의미가 있다(state 객체는 destroy 후에도 남는다).
      - name: Verify plan role boundary (allow 3 / deny 12)
        run: |
          set -uo pipefail

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${PROJECT}-terraform-state-${ACCOUNT}"
          LOCK_TABLE="${PROJECT}-terraform-lock"
          OKTA_ARN=$(aws ssm get-parameter --name "/${PROJECT}/security/okta_secret_arn" \
            --query Parameter.Value --output text)
          if [ -z "$ACCOUNT" ] || [ -z "$OKTA_ARN" ]; then
            echo "::error::가드 준비 실패 — 계정 ID 또는 Okta 시크릿 ARN 을 얻지 못함"
            exit 1
          fi
          # 존재하지 않는 리소스 식별자를 쓴다. 권한이 없으면 AccessDenied, 있으면 NotFound가 온다.
          # 권한이 다시 열리면 "판정 불가"로 실패하니까, 틀려도 안전한 쪽으로 틀린다.
          FAKE_CF_ID="E000000GUARD00"
          FAKE_LISTENER="arn:aws:elasticloadbalancing:${AWS_REGION}:${ACCOUNT}:listener/app/guard-probe/0123456789abcdef/0123456789abcdef"
          fail=0

          # 허용돼야 하는 호출. 성공해야 PASS
          allow() {
            local desc="$1"; shift
            if "$@" >/dev/null 2>&1; then
              echo "  yes  ${desc}"
            else
              echo "::error::기대=허용, 실제=실패 — ${desc}"; fail=1
            fi
          }

          # 거부돼야 하는 호출. AccessDenied나 403이어야 PASS
          #   stdout은 버린다. 권한이 열려 있어도 시크릿이나 헤더 값이 로그에 안 남게.
          deny() {
            local desc="$1"; shift
            local err
            if err=$("$@" 2>&1 >/dev/null); then
              echo "::error::기대=거부, 실제=허용 — ${desc} (권한 과다)"; fail=1
            elif grep -qE 'AccessDenied|\(403\)' <<<"$err"; then
              echo "  no   ${desc}"
            else
              echo "::error::기대=거부, 판정 불가 — ${desc}"; head -3 <<<"$err"; fail=1
            fi
          }

          echo "== 허용 — CI plan 에 필요한 것 =="
          allow "01 state 읽기" \
            aws s3api head-object --bucket "$BUCKET" --key stacks/01-network/terraform.tfstate
          allow "02 state 읽기" \
            aws s3api head-object --bucket "$BUCKET" --key stacks/02-security/terraform.tfstate
          # 이 권한이 빠져도 plan은 실패하지 않고, 로그 버킷이 없다고 보고 다시 만들려고 한다. 조용히 틀리는 걸 여기서 시끄럽게 잡는다.
          allow "로그 버킷 존재 확인 (없으면 02 plan 이 '삭제됨'으로 오판)" \
            aws s3api head-bucket --bucket "${PROJECT}-cloudtrail-${ACCOUNT}"

          echo "== 거부 — state·시크릿 =="
          deny "03 state 읽기 (Okta 시크릿·X-Origin-Verify 보유)" \
            aws s3api head-object --bucket "$BUCKET" --key stacks/03-workload/terraform.tfstate
          deny "05 state 읽기 (CI plan 대상 아님)" \
            aws s3api head-object --bucket "$BUCKET" --key stacks/05-k8s/terraform.tfstate
          deny "03 경로 목록 조회" \
            aws s3api list-objects-v2 --bucket "$BUCKET" --prefix stacks/03-workload/ --max-items 1
          deny "Okta 시크릿 값 읽기" \
            aws secretsmanager get-secret-value --secret-id "$OKTA_ARN"

          echo "== 거부 — 같은 값을 '설정 조회'로 돌려주는 API =="
          deny "CloudFront 배포 목록 (오리진 헤더 포함)" \
            aws cloudfront list-distributions --max-items 1
          deny "CloudFront 배포 설정 (오리진 헤더 포함)" \
            aws cloudfront get-distribution-config --id "$FAKE_CF_ID"
          deny "ALB 리스너 규칙 (헤더 조건 값 포함)" \
            aws elbv2 describe-rules --listener-arn "$FAKE_LISTENER"
          deny "WAF 조회 (샘플 요청에 실제 요청 헤더 포함)" \
            aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 --limit 1

          echo "== 거부 — 감사 기록 내용 =="
          # plan에는 로그 그룹 메타데이터 조회만 있으면 된다. 감사 로그 내용은 "누가 뭘 했나" 그 자체라 CI가 읽으면 안 된다.
          # (그룹이 없어도 권한이 없으면 AccessDenied가 먼저 온다)
          deny "EKS 감사 로그 내용 읽기" \
            aws logs filter-log-events --log-group-name "/aws/eks/joshua-eks/cluster" --limit 1
          # 저장 쿼리(02 eks_audit_queries.tf)는 plan이 정의만 조회한다. 쿼리 실행은 같은 감사 로그를 읽는 또 다른 길이라 막혀 있어야 한다.
          # (최근 1분, 1건이라 권한이 열려 있어도 스캔량은 아주 적다)
          deny "EKS 감사 로그 쿼리 실행 (Logs Insights)" \
            aws logs start-query --log-group-name "/aws/eks/joshua-eks/cluster" \
              --start-time "$(( $(date +%s) - 60 ))" --end-time "$(date +%s)" \
              --query-string "fields @timestamp | limit 1"
          # Athena는 CloudTrail·Flow Logs·WAF를 한 번에 조회하는 길이다. plan에는 카탈로그와 워크그룹 메타데이터 조회만 필요하다.
          # (SELECT 1이라 권한이 열려 있어도 로그를 스캔하지 않는다)
          deny "Athena 로그 조회 실행" \
            aws athena start-query-execution --work-group "${PROJECT}-security" --query-string "SELECT 1"

          echo "== 거부 — 쓰기 =="
          # 조건식이 항상 거짓이라 권한이 있어도 실제로 써지지는 않는다(부작용 없는 확인용 호출).
          deny "잠금 테이블 쓰기" \
            aws dynamodb put-item --table-name "$LOCK_TABLE" \
              --item '{"LockID":{"S":"guard-probe"}}' \
              --condition-expression "attribute_exists(LockID)"

          if [ "$fail" -ne 0 ]; then
            echo "::error::plan 역할의 권한 경계가 설계와 다르다 — plan 을 실행하지 않는다"
            exit 1
          fi
          echo "== 허용 3 / 거부 12 — 경계 확인 완료 =="

  # 영속 스택 plan
  plan:
    name: Plan ${{ matrix.stack }}
    needs: guard
    # ubuntu-latest가 Ubuntu 26으로 바뀌어도 실행 환경이 갑자기 달라지지 않게 버전을 고정한다.
    runs-on: ubuntu-24.04

    # 스택별로 병렬 plan (한 스택이 실패해도 나머지는 계속 돈다)
    strategy:
      fail-fast: false
      matrix:
        stack: ["01-network", "02-security"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Configure AWS Credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ matrix.stack }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "1.14.0"

      - name: Terraform Init
        working-directory: ${{ matrix.stack }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate

      # -lock=false: CI plan은 참고용 읽기라 잠금 테이블에 쓰지 않는다.
      #   그래서 plan 시점 state가 최신이라는 보장은 없다.
      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.stack }}
        run: terraform plan -input=false -no-color -lock=false
        continue-on-error: true  # 코멘트는 남기고, 잡 실패는 마지막 스텝에서 처리한다

      - name: Comment Plan Result
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          script: |
            const stack = '${{ matrix.stack }}';
            const outcome = '${{ steps.plan.outcome }}';
            const emoji = outcome === 'success' ? '✅' : '⚠️';
            const body = `${emoji} **Terraform Plan — \`${stack}\`**: \`${outcome}\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      # plan은 continue-on-error로 넘겼으니 여기서 결과를 보고 잡을 실패시킨다. 체크 색이 곧 plan 결과가 되게.
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: |
          echo "::error::terraform plan 실패 (${{ matrix.stack }}) — 위 Terraform Plan 로그 확인"
          exit 1
