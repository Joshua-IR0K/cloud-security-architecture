# ============================================================
# .github/workflows/terraform-plan.yml
# ============================================================
# main으로 향하는 PR에서 terraform plan 자동 실행
# OIDC로 임시 자격증명 획득 (장기 키 없음)
# 방향 A: plan 전용 — apply는 로컬에서 수동
#
# 사전 준비:
#   레포 Settings → Secrets and variables → Actions → Variables
#   → AWS_ROLE_ARN 변수에 bootstrap output의 Role ARN 등록
# ============================================================

name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "01-network/**"
      - "02-security/**"
      - "03-workload/**"

# ★ OIDC 토큰 발급에 필수
permissions:
  id-token: write   # OIDC 토큰 수신
  contents: read    # 레포 체크아웃
  pull-requests: write  # PR에 plan 결과 코멘트

env:
  AWS_REGION: ap-northeast-2
  # 비민감 변수는 TF_VAR_ 환경변수로 주입 (tfvars는 git 제외되므로)
  # 레포 Variables에 DOMAIN_NAME 등록 필요
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}

jobs:
  plan:
    name: Plan ${{ matrix.stack }}
    runs-on: ubuntu-latest

    # 각 스택을 병렬 plan (한 스택 실패해도 나머지는 진행)
    strategy:
      fail-fast: false
      matrix:
        stack: ["01-network", "02-security", "03-workload"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ★ OIDC로 AWS 임시 자격증명 획득 (장기 키 없음)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}  # Repository Variable 참조
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ matrix.stack }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: ${{ matrix.stack }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.stack }}
        run: terraform plan -input=false -no-color
        continue-on-error: true

      # plan 결과를 PR 코멘트로 게시
      - name: Comment Plan Result
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const stack = '${{ matrix.stack }}';
            const outcome = '${{ steps.plan.outcome }}';
            const emoji = outcome === 'success' ? '✅' : '⚠️';
            const body = `${emoji} **Terraform Plan — \`${stack}\`**: \`${outcome}\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
