# plan 워크플로와 따로 둔다. 정적 스캔이라 AWS 자격증명이 필요 없어서 contents: read만 준다.
# 액션을 SHA로 고정하면 Checkov 버전도 고정돼서 새 검사가 갑자기 게이트를 깨지 않는다. 버전업은 Dependabot PR의 스캔 결과를 보고 정한다.

name: Checkov IaC Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "00-bootstrap/**"
      - "01-network/**"
      - "02-security/**"
      - "03-workload/**"
      - "04-eks/**"
      - "05-k8s/**"
      - ".checkov.yaml"  # skip 기준이 바뀌는 PR도 꼭 스캔한다
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov Scan
    # ubuntu-latest가 Ubuntu 26으로 바뀌어도 실행 환경이 갑자기 달라지지 않게 버전을 고정한다.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895  # v12.3134.0 (checkov 3.3.29)
        with:
          directory: .
          framework: terraform,github_actions
          output_format: cli
          soft_fail: false  # 위반이 있으면 PR을 막는다
          # 레포 루트의 .checkov.yaml을 알아서 읽는다
