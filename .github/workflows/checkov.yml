# ============================================================
# .github/workflows/checkov.yml — IaC 보안 정적 스캔
# ============================================================
# Checkov: Terraform 코드를 1,000+ 보안 정책으로 정적 분석
#
# plan 워크플로우와 분리한 이유:
#   - 정적 스캔이라 AWS 자격증명 불필요 (OIDC 권한 없음)
#   - 워크플로우 자체에도 최소 권한 원칙 적용
#     (id-token: write 없이 contents: read만)
#
# 운영 모드:
#   초기: soft_fail=true → 발견사항 리포트만 (PR 차단 안 함)
#   안정화 후: soft_fail=false → 위반 시 PR 차단 (게이트 모드)
#
# [3단계 파트 4] 실패 0 달성 — 이제 위반이 PR 을 실제로 막는다.
#   · 04·05·.checkov.yaml 도 검사 대상에 추가 (이전엔 05 만 바꾼 PR 에서 Checkov 가 돌지 않았다)
#   · 액션 SHA 고정 = Checkov 이미지 버전 고정 → 새 Checkov 의 새 검사가 예고 없이 게이트를 깨지 않는다.
#     버전업은 Dependabot PR 로 받고, 그 PR 의 스캔 결과로 판단한다.
# ============================================================

name: Checkov IaC Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "00-bootstrap/**"
      - "01-network/**"
      - "02-security/**"
      - "03-workload/**"
      - "04-eks/**"
      - "05-k8s/**"
      - ".checkov.yaml" # 검사 기준(skip)이 바뀌는 PR 도 반드시 스캔
      - ".github/workflows/**"

# 최소 권한 — 정적 스캔은 레포 읽기만 필요
permissions:
  contents: read

jobs:
  checkov:
    name: Checkov Scan
    # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀐다 — 실행 환경이 조용히 바뀌지 않게 버전을 고정한다
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895  # v12.3134.0 (checkov 3.3.29)
        with:
          directory: .
          # terraform + GitHub Actions 워크플로우 파일까지 스캔
          framework: terraform,github_actions
          output_format: cli
          # 초기 도입: 리포트만 (PR 차단 안 함)
          # 발견사항 검토/정리 후 false로 변경 → 게이트 모드
          soft_fail: false # true → false: 이제 위반 시 PR 차단 (게이트 모드)
          # 레포 루트의 .checkov.yaml 설정 자동 인식
