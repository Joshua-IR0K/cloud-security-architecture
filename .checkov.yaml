# ============================================================
# .checkov.yaml — Checkov 설정 (레포 루트)
# ============================================================
#
# skip 정책 운영 원칙:
#   1. 발견사항을 무조건 skip하지 않는다 — 먼저 "수정할 것 vs
#      의도적 결정으로 수용할 것"을 판단
#   2. skip은 반드시 사유와 함께 — 두 가지 방법:
#
#      방법 A (권장): 코드 인라인 주석 — 사유가 코드 옆에 남음
#        resource "aws_s3_bucket" "waf_logs" {
#          #checkov:skip=CKV_AWS_145:WAF 버킷은 us-east-1, 리전 제약으로 KMS 불가 (문서화된 결정)
#          ...
#        }
#
#      방법 B: 이 파일의 skip-check에 등록 — 전역 정책 제외
#        (프로젝트 전체에 해당하는 정책만, 사유 주석 필수)
#
# ============================================================

framework:
  - terraform
  - github_actions

# 전역 skip — 프로젝트 전체 설계 원칙에 따른 의도적 제외만 등록
# (개별 리소스 예외는 코드 인라인 주석 사용)
skip-check:
  # 아직 없음 — 첫 스캔 결과 검토 후 결정
  # 예시 형식:
  # - CKV_AWS_144  # S3 교차리전 복제: 포트폴리오 단일리전 설계, FinOps 원칙상 제외

# 스캔 제외 경로
skip-path:
  - .terraform
