# 여기에는 프로젝트 전체 원칙 때문에 빼는 검사만 둔다. 리소스별 사유는 그 리소스의 인라인 skip에 적고, 모든 skip에는 사유를 단다.

framework:
  - terraform
  - github_actions

skip-check:
  # SSM에는 VPC ID, ARN 같은 민감하지 않은 식별자만 넣는다. 진짜 시크릿은 Secrets Manager라서 String 타입이 맞다.
  - CKV2_AWS_34

  # 단일 리전 설계다. 교차 리전 복제를 켜면 저장·전송 비용이 두 배가 된다.
  - CKV_AWS_144

  # S3 이벤트 알림. 받아서 처리할 대상이 없다.
  - CKV2_AWS_62

  # S3 버킷 액세스 로깅. 액세스 로그를 모을 곳을 아직 정하지 않았다.
  - CKV_AWS_18

  # CloudTrail을 CloudWatch Logs로 보내지 않는다. 로그는 S3가 기본이다(README 설계 결정의 "로그 저장소").
  # 실시간 탐지는 GuardDuty와 EventBridge가 CloudTrail 이벤트를 직접 받아서 한다.
  - CKV2_AWS_10

skip-path:
  - .terraform
